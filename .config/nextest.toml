# The two test suites (docs/development/workflow.md): the focused one, every
# test but the fuzzy ones, within 15 seconds; and the fuzzy one, the test
# binaries named fuzzy_* beside each world's focused tests, within 1 minute. A
# suite past its budget fails, naming the tests it stopped; a test past its
# slow period is flagged SLOW as it runs.

[profile.default]
default-filter = "not binary(/^fuzzy_/) & not binary(/^(process|live)$/) & not binary(/^qa_/) & not binary(/^browser_/)"
global-timeout = "15s"
slow-timeout = { period = "3s" }

# The worlds' tests first, the longest, then the many short unit tests behind
# them, so that the run ends close to its total over the threads.
[[profile.default.overrides]]
filter = "kind(test)"
priority = 10

[profile.fuzzy]
default-filter = "binary(/^fuzzy_/) & not binary(/^(process|live)$/) & not binary(/^qa_/)"
global-timeout = "60s"
slow-timeout = { period = "20s" }

# The walking story's eight shards first, the suite's longest tests.
[[profile.fuzzy.overrides]]
filter = "test(/^fuzzy_walking_shard_/)"
priority = 20

# Measuring, not gating: no budget. With -j 1, each test's own time:
#   cargo nextest run --workspace --profile measure -j 1
#   cargo nextest run --workspace --profile measure -j 1 --ignore-default-filter -E 'binary(/^fuzzy_/)'
[profile.measure]
global-timeout = "1h"
slow-timeout = { period = "60s" }

[profile.process]
default-filter = "binary(=process)"
global-timeout = "10m"
test-threads = 1

[profile.live]
# The live tier (docs/design/domain/testing.md, 2.7): crates/temper's live binary
# alone, one test at a time, which scripts/proof-live.sh runs.
default-filter = "binary(/^(process|live)$/) & not binary(=process)"
global-timeout = "20m"
test-threads = 1
retries = 0

[profile.qa]
# The QA passes' tests (skein's docs/foundation/owners.md, 4.6): the binaries
# named qa_*, which the gate builds and does not run. One at a time: some start
# the shipped binary.
default-filter = "binary(/^qa_/)"
global-timeout = "10m"
test-threads = 1

# Chromium against temper serve, one test at a time (client/browser.md, 4.3).
[profile.browser]
default-filter = "package(temper-client-browser-world) & binary(/^browser_/)"
global-timeout = "60s"
slow-timeout = { period = "20s", terminate-after = 3 }
test-threads = 1
