[package]
name = "temper-conformance-world"
description = "Temper on jig's conformance harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-lib.workspace = true
temper-engine-domain.workspace = true
jig-core-people.workspace = true
jig-core-tasks.workspace = true
jig-core-fleet.workspace = true
jig-core-accounts.workspace = true
jig-core-authority.workspace = true
jig-core.workspace = true
temper-engine-domain-forge.workspace = true
temper-engine-domain-forge-change.workspace = true
temper-engine-domain-forge-client.workspace = true
temper-engine-forge-world = { path = "../engine/forge" }
temper-fake-forge-domain.workspace = true

jig-conformance.workspace = true
jig-fake-store.workspace = true
jig-fake-workers.workspace = true
jig-test-system.workspace = true
jig-core-world.workspace = true

temper-engine-domain-world = { path = "../engine/domain" }

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
