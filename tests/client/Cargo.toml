[package]
name = "temper-client-world"
description = "temper's client joined to its real engine root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-lib.workspace = true
skein-io.workspace = true
skein-world.workspace = true
jig-client-world.workspace = true
jig-fake-person.workspace = true
jig-test-domain-client.workspace = true
jig-test-domain.workspace = true
jig-core-world.workspace = true
jig-domain-client.workspace = true
jig-domain-core.workspace = true
jig-domain-people.workspace = true
jig-domain-tasks.workspace = true
jig-domain-views.workspace = true
jig-view.workspace = true
jig-protocol-transcript.workspace = true
smith-transcript.workspace = true
temper-client-domain.workspace = true
temper-client-view.workspace = true
temper-engine-domain.workspace = true
temper-engine-domain-forge.workspace = true
temper-engine-domain-forge-client.workspace = true
temper-engine-domain-world = { path = "../engine/domain" }

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
