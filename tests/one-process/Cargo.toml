[package]
name = "temper-one-process-world"
description = "Temper's service, native person and hosted agents on one simulated kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
temper-service.workspace = true
temper-shell-terminal.workspace = true
temper-client-domain.workspace = true
temper-engine-domain.workspace = true
temper-engine-domain-forge.workspace = true
temper-engine-protocol-forge.workspace = true
temper-protocol-store.workspace = true
temper-fake-git.workspace = true
temper-fake-forge-domain.workspace = true
temper-fake-forge-protocol.workspace = true
jig-channel-world.workspace = true
jig-domain-client.workspace = true
jig-domain-core.workspace = true
jig-domain-people.workspace = true
jig-domain-tasks.workspace = true
jig-view.workspace = true
jig-fake-person.workspace = true
jig-shell-native.workspace = true
jig-protocol-client-link.workspace = true
jig-protocol-client-wire.workspace = true
jig-protocol-config.workspace = true
jig-protocol-store.workspace = true
jig-conformance.workspace = true
jig-test-service = { git = "https://github.com/forgetic/jig.git" }
jig-core-world.workspace = true
smith-channel.workspace = true
smith-charter.workspace = true
skein-lib.workspace = true
skein-io.workspace = true
skein-shell.workspace = true
skein-world.workspace = true
skein-sim = { git = "https://github.com/forgetic/skein.git" }
skein-fake-machine = { git = "https://github.com/forgetic/skein.git" }
skein-fake-peers = { git = "https://github.com/forgetic/skein.git" }
skein-fake-llm-domain = { git = "https://github.com/forgetic/skein.git" }
skein-llm = { git = "https://github.com/forgetic/skein.git" }
skein-kv = { git = "https://github.com/forgetic/skein.git" }
smith-agent-process-world = { git = "https://github.com/forgetic/smith.git" }
smith-agent-shell = { git = "https://github.com/forgetic/smith.git" }
smith-agent-service = { git = "https://github.com/forgetic/smith.git" }
smith-host-protocol = { git = "https://github.com/forgetic/smith.git" }
smith-local-service = { git = "https://github.com/forgetic/smith.git" }
smith-protocol-llm = { git = "https://github.com/forgetic/smith.git" }
smith-domain.workspace = true
temper-engine-smith.workspace = true
temper-engine-protocol-forge-world = { path = "../engine/protocol-forge" }

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"          # the world asserts its invariants by panicking
wildcard_enum_match_arm = "deny"      # a new variant must break the translation
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
