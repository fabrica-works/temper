[package]
name = "temper-engine-protocol-forge-world"
description = "Forge component against recorded HTTP answers and scripted io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-forge.workspace = true
skein-lib.workspace = true
skein-http.workspace = true
skein-json.workspace = true
skein-io.workspace = true
skein-tls.workspace = true
skein-world.workspace = true
temper-engine-domain-forge-client.workspace = true
temper-engine-protocol-forge.workspace = true
temper-fake-forge-protocol.workspace = true
temper-fake-forge-domain.workspace = true
temper-engine-forge-world = { path = "../forge" }

temper-engine-domain-forge.workspace = true

temper-engine-domain-forge-change.workspace = true

temper-engine-domain-forge-issues.workspace = true

jig-domain-people.workspace = true

temper-service.workspace = true

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
