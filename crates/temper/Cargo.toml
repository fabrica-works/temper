skein-ui.workspace = true
temper-worker-domain.workspace = true
temper-engine-protocol-forge.workspace = true
jig-protocol-config.workspace = true
jig-domain-host.workspace = true
skein-io.workspace = true
skein-lib.workspace = true
skein-json.workspace = true
skein-shell.workspace = true
skein-tls.workspace = true
skein-oauth-accounts.workspace = true
skein-oauth.workspace = true
smith-agent-service.workspace = true
smith-local-domain.workspace = true
smith-agent-shell.workspace = true
