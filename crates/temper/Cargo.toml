[package]
name = "temper"
description = "Temper's standalone service and agent command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "temper"
path = "src/main.rs"

[dependencies]
temper-service.workspace = true
temper-shell-terminal.workspace = true
jig-view.workspace = true
temper-worker-domain.workspace = true
temper-engine-protocol-forge.workspace = true
jig-protocol-config.workspace = true
jig-domain-host.workspace = true
skein-io.workspace = true
skein-lib.workspace = true
skein-json.workspace = true
skein-shell.workspace = true
skein-tls.workspace = true
skein-oauth-accounts.workspace = true
smith-agent-shell.workspace = true
smith-local-service.workspace = true
smith-host-protocol.workspace = true

[dev-dependencies]
temper-shell-terminal.workspace = true
temper-client-domain.workspace = true
jig-fake-person.workspace = true
jig-view.workspace = true
jig-domain-client.workspace = true
jig-shell-native.workspace = true
jig-protocol-config.workspace = true
skein-world.workspace = true
skein-fake-peers.workspace = true
skein-fake-llm-domain.workspace = true
skein-llm.workspace = true
smith-agent-process-world.workspace = true
jig-channel-world.workspace = true
skein-tls-world.workspace = true
serde_json.workspace = true

[[test]]
name = "process"
path = "tests/process.rs"

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
missing_errors_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"

